name: Deploy

# main에 병합되면 CI(포맷·린트·테스트)를 통과한 뒤 운영 EC2에 자동 배포한다.
# 실제 배포 절차는 scripts/deploy.sh에 있고, 이 워크플로는 SSH로 그 스크립트를 서버에서 실행한다.
# 필요한 시크릿은 docs/DEPLOYMENT.md "8. 자동 배포" 참고.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: '서버에서 백필이 돌고 있어도 배포 (app 재기동으로 백필이 끊김)'
        type: boolean
        default: false

# 배포가 겹치지 않게 하고, 진행 중인 배포는 취소하지 않는다 (마이그레이션 도중 중단 방지).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      # 아래 4개는 선택. 보안 그룹이 22번을 내 IP로만 열어 둔 경우, 배포하는 동안만
      # 러너 IP를 보안 그룹에 추가했다가 끝나면 지운다.
      EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          for name in EC2_HOST EC2_SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::시크릿 ${name}이 없습니다"; missing=1; fi
          done
          exit "$missing"

      - name: Allow SSH from this runner
        if: env.EC2_SECURITY_GROUP_ID != ''
        run: |
          ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          if out=$(aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${ip}/32,Description=github-actions-deploy}]" 2>&1); then
            # 이 워크플로가 추가한 규칙만 끝나고 지운다.
            echo "RUNNER_IP=${ip}" >>"$GITHUB_ENV"
          elif grep -q 'InvalidPermission.Duplicate' <<<"$out"; then
            echo "${ip}/32는 이미 허용돼 있어 그대로 둡니다"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Set up SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" >~/.ssh/known_hosts
          else
            echo "::warning::EC2_KNOWN_HOSTS 시크릿이 없어 ssh-keyscan으로 호스트 키를 받습니다"
            for _ in 1 2 3 4 5; do
              ssh-keyscan -T 10 "$EC2_HOST" >~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
              sleep 5
            done
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          FORCE_DEPLOY: ${{ inputs.force && '1' || '0' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            "${EC2_USER}@${EC2_HOST}" \
            "FORCE_DEPLOY=${FORCE_DEPLOY} bash -s -- ${GITHUB_SHA}" <scripts/deploy.sh

      - name: Check from outside
        run: |
          status=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "http://${EC2_HOST}:3651/games?limit=1" || true)
          echo "http://${EC2_HOST}:3651/games?limit=1 -> ${status}"
          if [ "$status" != 200 ]; then
            echo "::warning::외부에서 3651 포트 응답이 200이 아닙니다 (보안 그룹 확인)"
          fi

      - name: Revoke SSH from this runner
        if: always() && env.RUNNER_IP != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
